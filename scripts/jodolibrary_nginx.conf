server {
    server_name jodolibrary.in www.jodolibrary.in api.jodolibrary.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jodolibrary.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jodolibrary.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.jodolibrary.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.jodolibrary.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = jodolibrary.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name jodolibrary.in www.jodolibrary.in api.jodolibrary.in;
    return 404;
}
